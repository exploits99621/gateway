<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Personal Gateway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>🔐 Personal Gateway</h1>
            <p class="subtitle">Login once, use forever</p>
            
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}
            
            <form method="POST">
                <div class="form-group">
                    <label>📧 Gmail Email</label>
                    <input type="email" name="gmail" value="exploitshacker32@gmail.com" required>
                </div>
                
                <div class="form-group">
                    <label>🔑 Gmail App Password</label>
                    <input type="password" name="app_password" placeholder="lkyi fewh erps abxk" required>
                    <small>Generate from Google Account > App Passwords</small>
                </div>
                
                <div class="form-group">
                    <label>💳 Your FamPay UPI ID</label>
                    <input type="text" name="fampay_id" value="9817317740@fam" required>
                </div>
                
                <div class="form-group">
                    <label>🔐 FamPay API Key</label>
                    <input type="text" name="fampay_api_key" value="FAM_371735AC5A8C95B29EDB8EA7E7CD51DA57863D3C" required>
                </div>
                
                <button type="submit" class="btn-primary">🚀 Activate Gateway</button>
            </form>
            
            <div class="info-text">
                <p>💡 Login once - Works for 100 years!</p>
                <p>🔄 Auto-verify payments 24/7</p>
                <p>📱 Generate QR codes for any amount</p>
            </div>
        </div>
    </div>
</body>
</html>
