<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Personal Gateway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="error-container">
        <div class="error-box">
            <div class="error-icon">⚠️</div>
            <h1>Something Went Wrong</h1>
            <div class="error-message">
                <p>{{ error or 'An unexpected error occurred.' }}</p>
            </div>
            <div class="error-actions">
                <a href="/" class="btn-primary">Go Home</a>
                <a href="/login" class="btn-secondary">Try Login</a>
            </div>
        </div>
    </div>
    
    <style>
        .error-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .error-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .error-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .error-box h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #f5c6cb;
        }
        
        .error-message p {
            margin: 0;
            word-break: break-all;
        }
        
        .error-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .error-actions .btn-primary {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        
        .error-actions .btn-secondary {
            padding: 12px 30px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        
        @media (max-width: 640px) {
            .error-actions {
                flex-direction: column;
            }
        }
    </style>
</body>
</html>
